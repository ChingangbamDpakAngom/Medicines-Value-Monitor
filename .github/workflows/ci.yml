name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Build against a small real sample (4 practices x 3 months) instead of the full 55M-row download.
      EPD_GLOB: ${{ github.workspace }}/tests/fixtures/epd/*/epd.parquet
      DUCKDB_PATH: ${{ github.workspace }}/data/warehouse.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ingest unit test
        run: python tests/test_ingest.py
      - name: dbt build (models + tests)
        working-directory: dbt
        run: dbt build --profiles-dir .
      - name: Dashboard smoke test
        run: python tests/test_app.py
